base_frame: robot_base_footprint
odom_frame: odom
sensor_frame: base_laser_link
radius: 0.45
is_holonomic: true

sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/scan
    frame: base_laser_link

nav2:
  footprint: "[ [0.38, 0.24], [0.38, -0.24], [-0.38, -0.24], [-0.38, 0.24] ]"
  polygons:
    - StopPolygon
  polygons_dict:
    StopPolygon:
      type: "polygon"
      points: "[ [0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2] ]"
      action_type: "stop"
      min_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
  planner_plugins:
    - GridBased
  planner_plugins_dict:
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

rl:
  actions:
    continuous:
      angular_range:
        - -0.3
        - 0.3
      linear_range:
        - -0.3
        - 0.3
    discrete:
      - {name: move_forward,  linear: 0.3,  angular: 0.0}
      - {name: move_backward, linear: -0.3, angular: 0.0}
      - {name: turn_left,     linear: 0.0,  angular: 0.3}
      - {name: turn_right,    linear: 0.0,  angular: -0.3}
      - {name: strafe_left,   linear_x: 0.0, linear_y: 0.3,  angular: 0.0}
      - {name: strafe_right,  linear_x: 0.0, linear_y: -0.3, angular: 0.0}
      - {name: stop,          linear: 0.0,  angular: 0.0}
  laser:
    angle:
      min: -2.35619449019
      max: 2.35619449019
      increment: 0.00436332312
    num_beams: 1081
    range: 10.0
    update_rate: 40
