robot_model: rbvogui_plus
base_frame: robot_base_footprint
z_offset: 0.37
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/scan
    frame: base_laser_link
control:
  mode: ros2_control
  config: package://arena_robots/robots/rbvogui_plus/control.yaml
  controllers:
    - joint_state_broadcaster
    - robotnik_base_controller
    - arm_controller
  cmd_vel_topic: robotnik_base_controller/cmd_vel
