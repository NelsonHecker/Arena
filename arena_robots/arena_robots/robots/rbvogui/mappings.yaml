- gz_topic: /model/{robot_name}/link/robot_vectornav_link/sensor/imu_sensor/imu
  ros_topic: imu/data
  ros_type: sensor_msgs/msg/Imu
  gz_type: gz.msgs.IMU
  direction: '['
- gz_topic: /model/{robot_name}/link/robot_front_laser_link/sensor/front_laser/scan
  ros_topic: scan
  ros_type: sensor_msgs/msg/LaserScan
  gz_type: gz.msgs.LaserScan
  direction: '['
- gz_topic: /model/{robot_name}/link/robot_front_laser_link/sensor/front_laser/scan/points
  ros_topic: scan/points
  ros_type: sensor_msgs/msg/PointCloud2
  gz_type: gz.msgs.PointCloudPacked
  direction: '['
- gz_topic: /model/{robot_name}/pose
  ros_topic: pose
  ros_type: geometry_msgs/msg/PoseStamped
  gz_type: gz.msgs.Pose
  direction: '['
