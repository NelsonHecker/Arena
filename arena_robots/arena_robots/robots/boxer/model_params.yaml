robot_model: boxer
base_frame: base_link
z_offset: 0.0635
sensors:
  - name: front_laser
    type: laserscan
    topic: ${namespace}/front_laser
    frame: lidar
  - name: rear_laser
    type: laserscan
    topic: ${namespace}/rear_laser
    frame: lidar
control:
  mode: ros2_control
  config: package://arena_robots/robots/boxer/control.yaml
  controllers:
    - joint_state_broadcaster
    - boxer_velocity_controller
  cmd_vel_topic: boxer_velocity_controller/cmd_vel
