robot_model: ridgeback
base_frame: base_link
z_offset: 0.37
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: lidar
control:
  mode: ros2_control
  config: package://arena_robots/robots/ridgeback/control.yaml
  controllers:
    - joint_state_broadcaster
    - ridgeback_velocity_controller
  cmd_vel_topic: ridgeback_velocity_controller/cmd_vel
