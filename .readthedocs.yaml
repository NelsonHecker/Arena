# Read the Docs build config. Must live at the repo root; everything else is in .docs/.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: .docs/mkdocs.yml

submodules:
  include: all
  recursive: true

python:
  install:
    - requirements: .docs/requirements.txt
