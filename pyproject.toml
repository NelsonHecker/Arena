[tool.uv]
package = false

[project]
name = "arena-rosnav"
version = "0.1.0"
description = ""
authors = [{ name = "Volodymyr Shcherbyna", email = "dev@voshch.dev" }]
maintainers = [{ name = "Volodymyr Shcherbyna", email = "dev@voshch.dev" }]
requires-python = "==3.12.*"
dependencies = [
    "pip",
    "colcon-common-extensions",
    "pytest",
    "lark",
    "rosdep",
    "PyYAML",
    "filelock",
    "scipy",
    "empy",
    "defusedxml",
    "lxml",
    "netifaces",
    "watchdog",
    "transforms3d",
    "opencv-python",
    "attrs",
    "shapely",
    "numpy",
    "setuptools<80",
    "pydantic",
    "pillow",
    "requests",
    "usd-core",
    "cattrs",
    "openai",
    "pycollada",
    "google-genai",
    "chromadb",
    "colourings",
    "aiofiles",
]

[project.optional-dependencies]
training = [
    "torch",
    "wandb",
    "tensorboard",
    "torchdiffeq",
    "diffcp",
    "cvxpy",
    "cvxpylayers",
    "mpi4py",
    "gputil",
    "tensorboardx",
    "gym",
    "opencv-python",
    "sb3-contrib",
    "shimmy",
]

[build-system]
requires = ["setuptools<80", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "aiomonitor>=0.7.1",
]
