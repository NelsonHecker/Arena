services:
  arena:
    image: "${ARENA_IMAGE}"
    pull_policy: "never"
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/features/docker/Dockerfile
      args:
        - gid=${HOST_GID}
        - uid=${HOST_UID}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
    environment:
      - QT_X11_NO_MITSHM=1
      - TMPDIR=/tmp/shared
      - DISPLAY
      - UV_LINK_MODE=copy
      - ARENA_IMAGE
      - ARENA_IMAGE_TAG
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - HOST_UID
      - HOST_GID
      - HOST_ARENA_WS_DIR
      - LLM_API_ENDPOINT
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    env_file:
      - "$HOST_ARENA_WS_DIR/.env"
    user: "${HOST_UID}"
    group_add:
      - sudo
    network_mode: host
    command: ["bash"]
    stdin_open: true 
    tty: true
    healthcheck:
      test: ["CMD", "test", "-f", "/.built"]
      interval: 1s
      timeout: 2s
      retries: 99999 # if you can't build by then, good juck
      start_period: 0s
    ports:
      - 50101
      - 50102

  isaac:
    image: "arena_isaac:${ARENA_IMAGE_TAG}"
    pull_policy: "never"
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/features/isaac/Dockerfile
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
    environment:
      - DISPLAY
      - TMPDIR=/tmp/shared
      - QT_X11_NO_MITSHM=1
      - UV_LINK_MODE=copy
      - ARENA_IMAGE
      - ARENA_IMAGE_TAG
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - HOST_UID
      - HOST_ARENA_WS_DIR
      - ROS_DOMAIN_ID=1
      - LLM_API_ENDPOINT
    stdin_open: true 
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  vllm:
    image: vllm/vllm-openai:latest
    profiles: [vllm]
    network_mode: host
    ipc: host
    volumes:
      - vllm-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen3-0.6B}
      - --served-model-name=${VLLM_SERVED_MODEL_NAME:-qwen}
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.4}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-4096}
      - --dtype=${VLLM_DTYPE:-auto}
      - --port=${VLLM_PORT:-8000}
      - --reasoning-parser=${VLLM_REASONING_PARSER:-qwen3}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${VLLM_PORT:-8000}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8760h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  vllm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: [vllm]
    network_mode: host
    depends_on: [vllm]
    volumes:
      - $HOST_ARENA_WS_DIR/src/Arena/_meta/docker/features/vllm/litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "${VLLM_PROXY_PORT:-4000}"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:${VLLM_PROXY_PORT:-4000}/health/liveliness\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  shared:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  vllm-cache: