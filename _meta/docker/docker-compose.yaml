services:
  arena:
    image: "${ARENA_IMAGE}"
    build:
      context: .
      dockerfile: src/Arena/_meta/docker/Dockerfile.dev
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "$ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$ARENA_WS_DIR/.env:/opt/arena_ws/.env"
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - UV_LINK_MODE=copy
      - ARENA_IMAGE
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - HOST_UID
    env_file:
      - "$ARENA_WS_DIR/.env"
    user: "${HOST_UID}"
    group_add:
      - sudo
    network_mode: host
    command: ["bash"]
    stdin_open: true 
    tty: true
    healthcheck:
      test: ["CMD", "test", "-f", "/.built"]
      interval: 1s
      timeout: 2s
      retries: 99999 # if you can't build by then, good juck
      start_period: 0s

  isaac:
    image: "arena_isaac"
    build:
      context: .
      dockerfile: src/Arena/arena_isaac/Dockerfile