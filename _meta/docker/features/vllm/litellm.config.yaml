model_list:
  - model_name: qwen
    litellm_params:
      model: openai/qwen
      api_base: http://localhost:8000/v1
      api_key: "sk-local"

router_settings:
  # Map Gemini model names that task_generator sends to our local vllm model.
  # Add new aliases here when consumers introduce new remote model strings.
  model_group_alias:
    "gemini-3-pro-preview": qwen
    "gemini-2.5-flash": qwen
    "gemini-2.0-flash": qwen

general_settings:
  master_key: "sk-local"
