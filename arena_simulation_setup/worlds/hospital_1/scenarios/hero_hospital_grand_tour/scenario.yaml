# Crowded End-to-End Main Hallway Traverse in hospital_1
# Render scenario: the robot drives the full central spine south -> north
# (y 1.5 -> 33, spine centerline x=10) through a crowd of walking
# pedestrians. No seated peds. Spine lanes keep >=0.2 m footprint
# clearance to the robot lane (robot at x=10.0): west lane x=9.0,
# east lanes x=10.7/11.0. Door-crossing visitors walk proven s11-style
# routes through the reception/exam/ward/pharmacy/doctors doors.
# Regions keep the declarative acoustic tier caps.

robots:
- name: jackal
  base_frame: jackal/base_link
  start: [10.0, 1.5, 1.5708]         # south lobby mouth, heading north
  phases:
  - goto: [10.0, 33.0, 1.5708]      # single goal: one end of the main hallway to the other (planner routes)

dynamic:

# Spine crowd: three walking lanes, both directions
- name: ped_nurse_south
  model: arenian
  pose: [11.0, 30.0, -1.5708]
  velocity: 0.65
  waypoint_mode: repeat
  waypoints:
  - [11.0, 2.0, -1.5708]
  - [11.0, 30.0, 1.5708]
- name: ped_elder_slow
  model: arenian
  pose: [9.0, 16.0, 1.5708]
  velocity: 0.40
  waypoint_mode: repeat
  waypoints:
  - [9.0, 24.0, 1.5708]
  - [9.0, 16.0, -1.5708]
- name: ped_doctor_north
  model: arenian
  pose: [10.7, 4.0, 1.5708]
  velocity: 0.55
  waypoint_mode: repeat
  waypoints:
  - [10.7, 30.0, 1.5708]
  - [10.7, 4.0, -1.5708]

# Sub-hallway traffic
- name: ped_staff_crosser
  model: arenian
  pose: [14.98, 10.2, 0.46]
  velocity: 0.50
  waypoint_mode: repeat
  waypoints:
  - [19.97, 12.5, 0.46]
  - [14.98, 10.2, -2.68]
- name: ped_sub_walker
  model: arenian
  pose: [13.5, 11.5, 0.0]
  velocity: 0.55
  waypoint_mode: repeat
  waypoints:
  - [23.5, 11.5, 0.0]
  - [13.5, 11.5, 3.1416]
- name: ped_waiting_visitor
  model: arenian
  pose: [22.0, 9.4, 1.5708]
  velocity: 0.45
  waypoint_mode: repeat
  waypoints:
  - [22.0, 12.2, 1.5708]
  - [22.0, 9.4, -1.5708]

# Door-crossing visitors (s11-proven door latitudes)
- name: ped_reception_visitor
  model: arenian
  pose: [4.0, 2.5, 0.0]
  velocity: 0.45
  waypoint_mode: repeat
  waypoints:
  - [10.5, 2.5, 1.5708]
  - [4.0, 2.5, 3.1416]
- name: ped_exam_visitor
  model: arenian
  pose: [7.2, 7.55, 0.0]
  velocity: 0.45
  waypoint_mode: repeat
  waypoints:
  - [9.5, 7.55, 0.0]
  - [7.2, 7.55, 3.1416]
- name: ped_ward_visitor
  model: arenian
  pose: [3.5, 22.5, 0.0]
  velocity: 0.45
  waypoint_mode: repeat
  waypoints:
  - [9.5, 21.1, 0.0]
  - [3.5, 22.5, 3.1416]
- name: ped_pharmacy_walker
  model: arenian
  pose: [5.0, 27.65, 0.0]
  velocity: 0.50
  waypoint_mode: repeat
  waypoints:
  - [11.0, 27.65, 0.0]
  - [5.0, 27.65, 3.1416]
- name: ped_doctor_break
  model: arenian
  pose: [13.0, 32.25, 0.0]
  velocity: 0.45
  waypoint_mode: repeat
  waypoints:
  - [10.0, 32.25, 3.1416]
  - [13.0, 32.25, 0.0]

# Nurse resting room + laboratory walkers
- name: ped_nurse_rest_walker
  model: arenian
  pose: [15.0, 2.5, 1.5708]
  velocity: 0.45
  waypoint_mode: repeat
  waypoints:
  - [15.0, 8.5, 1.5708]
  - [15.0, 2.5, -1.5708]
- name: ped_lab_walker
  model: arenian
  pose: [14.5, 22.5, 1.5708]
  velocity: 0.45
  waypoint_mode: repeat
  waypoints:
  - [14.5, 25.2, 1.5708]
  - [14.5, 22.5, -1.5708]

static: []
