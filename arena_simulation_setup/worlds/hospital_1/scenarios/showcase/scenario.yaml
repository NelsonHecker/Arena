# Showcase: interaction contract enhancements
#
# Use case 1 — Nurse escort: nurse agent advertises FOLLOW, patient accepts.
#              Shared contract duration ensures coordinated teardown.
# Use case 2 — Doctor consultation: doctor and patient engage in TALK_TO with
#              shared contract duration. Outcome propagates to behavior tree.
# Use case 3 — Reception queue: patients QUEUE_USE at reception desk.
#              If a participant leaves, others see INTERRUPTED outcome.

dynamic:
  # --- Use case 1: nurse escort ---
  - name: nurse_1
    model: female_adult_medical_01
    pose: central_hallway
    agent: {agent_type: ./nurse.yaml, desired_velocity: 1.5}
    waypoints:
      - patient_ward
      - central_hallway

  - name: escort_patient
    model: male_adult_construction_01
    pose: patient_ward
    agent: {agent_type: ./patient.yaml, desired_velocity: 0.9}
    waypoints:
      - central_hallway
      - exam_room_1

  # --- Use case 2: doctor consultation ---
  - name: doctor_1
    model: male_adult_medical_01
    pose: exam_room_1
    agent: {agent_type: ./doctor.yaml, desired_velocity: 1.4}
    waypoints:
      - exam_room_1
      - patient_ward
      - exam_room_1

  - name: consult_patient
    model: female_adult_business_02
    pose: waiting_area
    agent: {agent_type: ./patient.yaml, desired_velocity: 1.0}
    waypoints:
      - central_hallway
      - exam_room_1

  # --- Use case 3: reception queue ---
  - name: queue_patient_1
    model: male_adult_construction_02
    pose: {x: 9.5, y: 0.5}
    agent: {agent_type: ./patient.yaml, desired_velocity: 1.1}
    waypoints:
      - reception

  - name: queue_patient_2
    model: female_adult_business_02
    pose: {x: 10.0, y: 0.8}
    agent: {agent_type: ./patient.yaml, desired_velocity: 0.9}
    waypoints:
      - reception

  - name: queue_patient_3
    model: male_adult_construction_03
    pose: {x: 10.5, y: 0.5}
    agent: {agent_type: ./patient.yaml, desired_velocity: 1.0}
    waypoints:
      - reception

  # --- Background flow ---
  - name: doctor_2
    model: female_adult_medical_01
    pose: laboratory
    agent: {agent_type: adult, desired_velocity: 1.3}
    waypoints:
      - central_hallway
      - operating_room
      - central_hallway
      - laboratory

regions:
  visitor_entrance:
    type: source
    polygon:
      - {x: 9.25, y: 0.2}
      - {x: 10.75, y: 0.2}
      - {x: 10.75, y: 1.2}
      - {x: 9.25, y: 1.2}
    config:
      rate_profile:
        - {t: 0.0, rate: 0.1}
        - {t: 30.0, rate: 0.3}
      max_concurrent: 4
      max_total: 15
      agent:
        agent_type: adult
        desired_velocity: {min: 1.0, max: 1.5}
        sink_affinity:
          - {sink: waiting_sink, weight: 2.0}
          - {sink: pharmacy_sink, weight: 1.0}

  waiting_sink:
    type: sink
    ref: waiting_area
    config:
      capacity: 6

  pharmacy_sink:
    type: sink
    ref: pharmacy
    config:
      capacity: 4
