name: patient
mode: behavior
extends: elder
desired_velocity: {mean: 0.9, std: 0.15, clip_low: 0.4, clip_high: 1.4}

perception:
  vision_fov: {mean: 160.0, std: 15.0, clip_low: 90.0, clip_high: 270.0}

needs:
  checkin:
    initial: {mean: 20.0, std: 5.0, clip_low: 5.0, clip_high: 40.0}
    decay_rate: {mean: 0.8, std: 0.1}
  treatment:
    initial: {mean: 60.0, std: 10.0, clip_low: 30.0, clip_high: 80.0}
    decay_rate: {mean: 0.3, std: 0.05}

utility_weights:
  checkin: 1.5
  treatment: 1.0

actions:
  queue_reception:
    when:
      checkin: {below: 50.0}
    interaction: QUEUE_USE
    duration: {mean: 15.0, std: 3.0, clip_low: 5.0, clip_high: 30.0}
    patience: {mean: 60.0, std: 10.0, clip_low: 30.0, clip_high: 120.0}
    satisfies:
      checkin: 80.0
    on_failure: retry
  consultation:
    when:
      treatment: {below: 50.0}
    interaction: TALK_TO
    duration: {mean: 20.0, std: 5.0, clip_low: 10.0, clip_high: 40.0}
    patience: {mean: 45.0, std: 10.0, clip_low: 20.0, clip_high: 90.0}
    satisfies:
      treatment: 60.0

sequences:
  default:
    steps:
      arrive_and_interact:
        autonomous: true
        duration: {mean: 120.0, std: 20.0, clip_low: 60.0, clip_high: 240.0}
    then: default

initial_sequence: default
