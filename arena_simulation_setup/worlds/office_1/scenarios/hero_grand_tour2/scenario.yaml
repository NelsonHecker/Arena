robots:
- name: jackal
  base_frame: jackal/base_link
  start: [5.0, 5.0, 0.98]          # Initial heading pointing toward first segment
  phases:
  # 1. Exit cafeteria: smooth tangent arc heading northeast (~30°)
  - goto: [7.5, 12, 0.70]         # Direction vector toward next point (dx=2.5, dy=2.0)
  
  # 2. Corridor entry & straight run: tangent heading pointing due East (0.0 rad)
  - goto: [30.5, 19.5, 0.28]        # Long straight cruise down the corridor

  # 4. Bullpen aisle transit: smooth diagonal transition northeast
  - goto: [46.0, 19.5, 0.0]       # Final aisle cruise trajectory (dx=6.5, dy=5.0)


dynamic:

# 2. Main Hallway Oncoming Walker: Approaching from x=28.0 towards x=2.0 along north lane (y=12.6), stopping at west corridor end
- name: ped_hallway_encounter
  model: arenian
  pose: [60.0, 12.6, 3.1415]
  velocity: 0.22
  waypoint_mode: once
  waypoints:
  - [50.0, 12.6, 3.1415]
  - [60.0, 12.6, 3.1415]
  - [8.0, 12.6, 3.1415]
  - [2.0, 12.6, 3.1415]

# 3. Office Crosser: Crossing quiet bullpen across central transverse aisle
- name: ped_office_crosser
  model: arenian
  pose: [38.0, 15.0, 1.5708]
  velocity: 0.40
  waypoints:
  - [38.0, 24.0, 1.5708]
  - [38.0, 15.0, -1.5708]

# 4. Seated Observer in Meeting Room (Acoustic barrier observer)
- name: mic_meet_chair_board
  model: Office/office_female_caucasian_young
  pose: [6.50, 24.30, -2.36]
  velocity: 0.0
  waypoints:
  - [6.50, 24.30, -2.36]

# 5. Seated Observers in Quiet Bullpen / Workstations (Acoustic Disturbance Observers)
- name: mic_worker_desk_A
  model: Office/office_female_caucasian_young
  pose: [23.70, 18.50, -1.5708]
  velocity: 0.0
  waypoints:
  - [23.70, 18.50, -1.5708]
- name: mic_worker_desk_B
  model: Office/office_female_caucasian_young
  pose: [32.70, 18.50, -1.5708]
  velocity: 0.0
  waypoints:
  - [32.70, 18.50, -1.5708]
- name: mic_worker_desk_D
  model: Office/office_female_caucasian_young
  pose: [38.70, 18.50, -1.5708]
  velocity: 0.0
  waypoints:
  - [38.70, 18.50, -1.5708]

regions:
  cafeteria_cloaking:
    type: source
    polygon:
    - {x: 0.0, y: 0.0}
    - {x: 12.0, y: 0.0}
    - {x: 12.0, y: 12.0}    # Extended past the doorway at y=10.0
    - {x: 0.0, y: 12.0}
    config:
      max_velocity: 0.80     # Matches your contestant max_linear_vel
  hallway_cloaking:
    type: source
    polygon:
    - {x: 0.0, y: 10.0}
    - {x: 60.0, y: 10.0}
    - {x: 60.0, y: 14.0}
    - {x: 0.0, y: 14.0}
    config:
      max_velocity: 1.40
  bullpen_cloaking:
    type: source
    polygon:
    - {x: 18.0, y: 14.0}
    - {x: 48.0, y: 14.0}
    - {x: 48.0, y: 25.0}
    - {x: 18.0, y: 25.0}
    config:
      max_velocity: 0.40

static: []
timeline: []
conditions: []
