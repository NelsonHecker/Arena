robots:
- name: jackal
  base_frame: jackal/base_link
  start: [5.0, 5.0, 0.98]          # Initial heading pointing toward first segment
  phases:
  - goto: [46.0, 19.5, 0.0]       # Final aisle cruise trajectory (dx=6.5, dy=5.0)


dynamic:

# 2. Main Hallway Oncoming Walker: Approaching from x=28.0 towards x=2.0 along north lane (y=12.6), stopping at west corridor end
- name: ped_hallway_encounter
  model: arenian
  pose: [60.0, 12.6, 3.1415]
  velocity: 0.25
  waypoints:
  - [2.0, 12.6, 3.1415]
  - [60.0, 12.6, 3.1415]

- name: ped_sidehallway_encounter
  model: arenian
  pose: [13.5, 1, 3.1415]
  velocity: 0.25
  waypoints:
  - [13.5, 12, 3.1415]

